# docker compose up -d   (see docs/deploy.md)
#
# Default: Racking only, published on RACKING_BIND_IP (default 127.0.0.1).
# Behind Traefik with TLS (off by default; copy config/traefik-dynamic.yml.example
# to config/traefik-dynamic.yml and edit it, set ACME_EMAIL):
#   docker compose -f compose.yaml -f compose.traefik.yaml --profile traefik up -d
# The second file removes the host port of `racking`, so only Traefik is exposed.
services:
  racking:
    build: .
    image: racking-server:local
    restart: unless-stopped
    # The server handles SIGTERM: it stops accepting, lets requests in flight
    # finish (shutdown_grace_secs, default 10) and checkpoints SQLite. `init: true`
    # runs an init as PID 1 so the signal reaches the server (the kernel ignores
    # unhandled signals for PID 1; here it is handled, and init also reaps
    # children). The compose grace period must stay above the server's own.
    init: true
    stop_grace_period: 15s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - racking-data:/data
      - ./config/server.toml:/config/server.toml:ro
    # The only thing that decides who can reach the server over the network is
    # the address Docker publishes this port on (the server inside the
    # container accepts any peer, see config/server.example.toml). Default:
    # this machine. For the LAN set RACKING_BIND_IP=192.168.1.20 (shell or
    # .env file). Never 0.0.0.0 or a public address.
    ports:
      - "${RACKING_BIND_IP:-127.0.0.1}:7878:7878"
    # Alternative on Linux, only for real peer addresses in the server log:
    # remove `ports:`, set `bind` in server.toml to the LAN address, and
    # uncomment:
    # network_mode: host
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  traefik:
    profiles: ["traefik"]
    image: traefik:v3.6.25
    restart: unless-stopped
    depends_on: [racking]
    # No Docker socket: routes come from config/traefik-dynamic.yml (file
    # provider), so Traefik cannot reach the Docker API. See docs/deploy.md.
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      # Against slow connections. writeTimeout must stay above the 55 s
      # maximum of GET /inbox/wait, or long polls are cut.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=60s
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=90s
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=120s
      # TLS-ALPN challenge: needs port 443 only; port 80 just redirects.
      - --certificatesResolvers.le.acme.tlsChallenge=true
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL:-webmaster@racking.invalid}
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  racking-data:
  traefik-acme:
