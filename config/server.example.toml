# Racking server configuration for the container (compose.yaml).
# Copy to config/server.toml (never commit it), replace every CHANGE-ME with
# the output of `openssl rand -hex 32`, then chmod 600.

# Inside the container the server listens on every interface, or the published
# port cannot reach it, and it accepts any peer: Docker NATs published ports,
# so the server sees the bridge address, not the client, and allow_from cannot
# tell clients apart. Exposure is decided ONLY by where compose.yaml publishes
# the port (RACKING_BIND_IP, default 127.0.0.1: never 0.0.0.0 or a public
# address) and, for the Internet, by Traefik with TLS. Real access control is
# the tokens, roles and limits below. Do not copy these three lines to a
# server that runs outside a container.
bind = "0.0.0.0:7878"
allow_public_bind = true
allow_from = ["0.0.0.0/0", "::/0"]

# Only with the Traefik route (compose.traefik.yaml), which removes the host
# port so Traefik is the only peer: trust its X-Forwarded-For, so per-address
# limits and logs see the real client. Never set it while the port is
# published (the default compose.yaml), or any client can claim any address.
# Use the subnet of the compose network (docker network inspect racking_default).
# trusted_proxies = ["172.18.0.0/16"]

# Seconds SIGTERM or SIGINT lets requests in flight finish before the server
# saves the database and exits (0 to 60). Whatever stops the server must wait
# longer: Docker waits 10 s unless compose.yaml sets stop_grace_period.
# shutdown_grace_secs = 10

# The volume mounted by compose.yaml.
data_dir = "/data"

[agents.linux]
token = "CHANGE-ME-linux-token"
admin = true
role = "main"

[agents.windows]
token = "CHANGE-ME-windows-token"

